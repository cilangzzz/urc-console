[package]
name = "urc-app"
version = "0.1.0"
edition = "2021"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
hound = "3"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lib]
name = "urc_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
